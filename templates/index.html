<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College AI Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
            overflow: hidden;
        }

        .title {
            background: #2563eb;
            color: white;
            padding: 18px;
        }

        #chat {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #e0e7ff;
        }

        .user {
            background: #2563eb;
            color: white;
            text-align: right;
        }

        .input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 College AI Assistant</h1>
    <p>Your Virtual College Help Desk</p>
</header>

<div class="container">

    <div class="title">
        <h3>🤖 Chat with College Assistant</h3>
        <p>Ask about courses, admission, fees and placement.</p>
    </div>

    <div id="chat">
        <div class="message bot">
            Hello! 👋 Welcome to our college website.
            How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Type your question..."
            maxlength="500"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const message = input.value.trim();

    if (!message) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;
    chat.appendChild(userMessage);

    input.value = "";

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.textContent = data.reply || "Please try again.";
        chat.appendChild(botMessage);

    } catch (error) {
        const errorMessage = document.createElement("div");
        errorMessage.className = "message bot";
        errorMessage.textContent = "Connection error. Please try again.";
        chat.appendChild(errorMessage);
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
